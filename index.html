<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Metro</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="intro">
    <div id="introSearch" class="intro-search">
      <span id="introTyped"></span>
      <span id="introCaret" class="intro-caret"></span>
      <button id="introGo" class="intro-go" tabindex="-1" aria-hidden="true">Buscar</button>
    </div>
    <img id="introLogo" class="intro-logo" src="assets/outside.png" alt="Outside Co.">
  </div>

  <div id="stage"><div id="notifs"></div></div>

  <div id="controls">
    <button id="playBtn">▶</button>
    <div id="progress"><div id="progressBar"></div></div>
  </div>

  <button id="replayBtn" class="replay-btn">↻ Replay</button>

  <script src="app.js"></script>
</body>
</html>
